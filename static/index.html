<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator · DevOps Live Microservice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d15;
      --surface: #111827;
      --surface-light: #1f2937;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #4f46e5;
      --primary-hover: #6366f1;
      --accent-blue: #38bdf8;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse at 10% 20%, rgba(79, 70, 229, 0.15), transparent 40%),
        radial-gradient(ellipse at 90% 80%, rgba(56, 189, 248, 0.12), transparent 40%);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Calculator Card */
    .calculator-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(79, 70, 229, 0.15);
      position: relative;
    }

    /* Header Bar */
    .calc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .calc-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .version-pill {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      color: var(--accent-blue);
    }

    /* Display Screen */
    .display-screen {
      background: #06090e;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      position: relative;
      overflow: hidden;
    }

    .history-row {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 1.25rem;
      word-break: break-all;
    }

    .main-row {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .main-row::-webkit-scrollbar {
      display: none;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.35rem;
    }

    .latency-pill {
      color: var(--accent-green);
    }

    .latency-pill.err {
      color: var(--accent-red);
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.65rem;
    }

    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 0;
      background: var(--surface-light);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-op {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.25);
      color: var(--accent-blue);
    }

    .btn-op:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .btn-clear {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
      color: var(--accent-red);
    }

    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .btn-equals {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      border-color: #6366f1;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .btn-equals:hover {
      background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    /* Dynamic Features Row */
    .features-panel {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .features-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }

    .features-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .feature-chip {
      background: rgba(79, 70, 229, 0.12);
      border: 1px solid rgba(79, 70, 229, 0.3);
      color: #a5b4fc;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .feature-chip:hover {
      background: rgba(79, 70, 229, 0.25);
      border-color: rgba(79, 70, 229, 0.5);
    }

    /* Telemetry Footer Card */
    .telemetry-card {
      background: rgba(17, 24, 39, 0.65);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .telemetry-links {
      display: flex;
      gap: 0.85rem;
    }

    .telemetry-links a {
      color: var(--accent-blue);
      text-decoration: none;
      font-family: 'DM Mono', monospace;
    }

    .telemetry-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="calculator-card">
      <div class="calc-header">
        <div class="calc-title">
          <div class="pulse-dot"></div>
          <span>OpsPilot Calculator</span>
        </div>
        <div class="version-pill" id="versionBadge">v1.0</div>
      </div>

      <!-- LED Display -->
      <div class="display-screen">
        <div class="history-row" id="historyDisplay"></div>
        <div class="main-row" id="mainDisplay">0</div>
        <div class="status-bar">
          <span id="opBadge">READY</span>
          <span class="latency-pill" id="latencyBadge">0 ms</span>
        </div>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <button class="btn btn-clear" onclick="clearAll()">C</button>
        <button class="btn btn-op" onclick="deleteChar()">⌫</button>
        <button class="btn btn-op" onclick="setOperator('pow', '^')">xʸ</button>
        <button class="btn btn-op" onclick="setOperator('div', '÷')">÷</button>

        <button class="btn" onclick="appendDigit('7')">7</button>
        <button class="btn" onclick="appendDigit('8')">8</button>
        <button class="btn" onclick="appendDigit('9')">9</button>
        <button class="btn btn-op" onclick="setOperator('mul', '×')">×</button>

        <button class="btn" onclick="appendDigit('4')">4</button>
        <button class="btn" onclick="appendDigit('5')">5</button>
        <button class="btn" onclick="appendDigit('6')">6</button>
        <button class="btn btn-op" onclick="setOperator('sub', '−')">−</button>

        <button class="btn" onclick="appendDigit('1')">1</button>
        <button class="btn" onclick="appendDigit('2')">2</button>
        <button class="btn" onclick="appendDigit('3')">3</button>
        <button class="btn btn-op" onclick="setOperator('add', '+')">+</button>

        <button class="btn" onclick="toggleSign()">±</button>
        <button class="btn" onclick="appendDigit('0')">0</button>
        <button class="btn" onclick="appendDecimal()">.</button>
        <button class="btn btn-equals" onclick="computeResult()">=</button>
      </div>

      <!-- Dynamic AI Synthesized Features Panel -->
      <div class="features-panel">
        <div class="features-title">
          <span>AI Plugin Features</span>
          <span id="featuresCount">Loaded: 0</span>
        </div>
        <div class="features-grid" id="featuresGrid">
          <!-- Populated dynamically from /health -->
        </div>
      </div>
    </div>

    <!-- Telemetry Link Bar -->
    <div class="telemetry-card">
      <div>Microservice on <code id="hostLabel">Live API</code></div>
      <div class="telemetry-links">
        <a href="/health" target="_blank">/health</a>
        <a href="/metrics" target="_blank">/metrics</a>
        <a href="/docs" target="_blank">/docs</a>
      </div>
    </div>
  </div>

  <script>
    let currentInput = "0";
    let previousInput = null;
    let selectedOp = null;
    let opSymbol = "";
    let justComputed = false;

    const mainDisplay = document.getElementById("mainDisplay");
    const historyDisplay = document.getElementById("historyDisplay");
    const opBadge = document.getElementById("opBadge");
    const latencyBadge = document.getElementById("latencyBadge");
    const versionBadge = document.getElementById("versionBadge");
    const featuresGrid = document.getElementById("featuresGrid");
    const featuresCount = document.getElementById("featuresCount");
    const hostLabel = document.getElementById("hostLabel");

    hostLabel.textContent = window.location.host;

    function updateDisplay() {
      mainDisplay.textContent = currentInput;
      if (previousInput !== null && selectedOp !== null) {
        historyDisplay.textContent = `${previousInput} ${opSymbol}`;
      } else {
        historyDisplay.textContent = "";
      }
    }

    function appendDigit(digit) {
      if (justComputed) {
        currentInput = digit;
        justComputed = false;
      } else if (currentInput === "0") {
        currentInput = digit;
      } else {
        currentInput += digit;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (justComputed) {
        currentInput = "0.";
        justComputed = false;
      } else if (!currentInput.includes(".")) {
        currentInput += ".";
      }
      updateDisplay();
    }

    function clearAll() {
      currentInput = "0";
      previousInput = null;
      selectedOp = null;
      opSymbol = "";
      justComputed = false;
      opBadge.textContent = "READY";
      updateDisplay();
    }

    function deleteChar() {
      if (justComputed) {
        clearAll();
        return;
      }
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = "0";
      }
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput !== "0") {
        if (currentInput.startsWith("-")) {
          currentInput = currentInput.slice(1);
        } else {
          currentInput = "-" + currentInput;
        }
        updateDisplay();
      }
    }

    function setOperator(op, symbol) {
      if (previousInput !== null && selectedOp !== null && !justComputed) {
        computeResult().then(() => {
          previousInput = currentInput;
          selectedOp = op;
          opSymbol = symbol;
          opBadge.textContent = `OP: ${op.toUpperCase()}`;
          justComputed = true;
          updateDisplay();
        });
        return;
      }
      previousInput = currentInput;
      selectedOp = op;
      opSymbol = symbol;
      opBadge.textContent = `OP: ${op.toUpperCase()}`;
      justComputed = true;
      updateDisplay();
    }

    async function computeResult() {
      if (selectedOp === null || previousInput === null) return;
      const a = parseFloat(previousInput);
      const b = parseFloat(currentInput);

      opBadge.textContent = "CALCULATING...";
      const t0 = performance.now();

      try {
        const resp = await fetch(`/calc/${selectedOp}?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
        const elapsed = Math.round(performance.now() - t0);
        latencyBadge.textContent = `${elapsed} ms`;
        latencyBadge.className = resp.ok ? "latency-pill" : "latency-pill err";

        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.detail || `Error ${resp.status}`);
        }

        historyDisplay.textContent = `${a} ${opSymbol} ${b} =`;
        currentInput = String(data.result);
        previousInput = null;
        selectedOp = null;
        opSymbol = "";
        justComputed = true;
        opBadge.textContent = "SUCCESS (200)";
        updateDisplay();
      } catch (err) {
        historyDisplay.textContent = `${a} ${opSymbol} ${b} =`;
        currentInput = "Error";
        opBadge.textContent = err.message.slice(0, 24);
        justComputed = true;
        updateDisplay();
      }
    }

    async function executeUnaryFeature(op, symbol) {
      const a = parseFloat(currentInput);
      opBadge.textContent = `FEATURE: ${op.toUpperCase()}...`;
      const t0 = performance.now();

      try {
        const resp = await fetch(`/calc/${op}?a=${encodeURIComponent(a)}`);
        const elapsed = Math.round(performance.now() - t0);
        latencyBadge.textContent = `${elapsed} ms`;
        latencyBadge.className = resp.ok ? "latency-pill" : "latency-pill err";

        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `Error ${resp.status}`);

        historyDisplay.textContent = `${symbol}(${a}) =`;
        currentInput = String(data.result);
        justComputed = true;
        opBadge.textContent = "SUCCESS (200)";
        updateDisplay();
      } catch (err) {
        historyDisplay.textContent = `${symbol}(${a}) =`;
        currentInput = "Error";
        opBadge.textContent = err.message.slice(0, 24);
        justComputed = true;
        updateDisplay();
      }
    }

    // Keyboard support
    window.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") appendDigit(e.key);
      else if (e.key === ".") appendDecimal();
      else if (e.key === "+") setOperator("add", "+");
      else if (e.key === "-") setOperator("sub", "−");
      else if (e.key === "*") setOperator("mul", "×");
      else if (e.key === "/") { e.preventDefault(); setOperator("div", "÷"); }
      else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); computeResult(); }
      else if (e.key === "Backspace") deleteChar();
      else if (e.key === "Escape") clearAll();
    });

    // Fetch live service health & features
    async function fetchHealth() {
      try {
        const resp = await fetch("/health");
        if (resp.ok) {
          const data = await resp.json();
          versionBadge.textContent = `v${data.version || "1.0"}`;
          
          const builtIn = new Set(["add", "sub", "mul", "div", "pow"]);
          const plugins = (data.operations || []).filter(op => !builtIn.has(op));
          featuresCount.textContent = `Plugins: ${plugins.length}`;

          featuresGrid.innerHTML = "";
          if (plugins.length === 0) {
            featuresGrid.innerHTML = '<span style="font-size:0.75rem; color:#64748b;">No plugins synthesized yet. Use Code Agent Feature Studio to add custom operations!</span>';
          } else {
            plugins.forEach(plugin => {
              const chip = document.createElement("button");
              chip.className = "feature-chip";
              chip.textContent = `${plugin}()`;
              chip.onclick = () => executeUnaryFeature(plugin, plugin);
              featuresGrid.appendChild(chip);
            });
          }
        }
      } catch (err) {
        console.warn("Health check error:", err);
      }
    }

    fetchHealth();
    setInterval(fetchHealth, 5000);
  </script>
</body>
</html>
